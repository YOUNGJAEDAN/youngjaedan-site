<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#191919" />
    <title>영재단 · 소개</title>
    <style>
      :root {
        --bg: #191919;
        --surface: #202020;
        --raised: #2a2a2a;
        --line: #3a3a3a;
        --control: #969089;
        --text: #f7f6f3;
        --muted: #b0b0b0;
        --accent: #d4b895;
        --radius: 10px;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        scroll-behavior: smooth;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", "Malgun Gothic", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-text-size-adjust: 100%;
        word-break: keep-all;
      }
      a {
        color: var(--accent);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .skip {
        position: absolute;
        left: 8px;
        top: -60px;
        background: var(--accent);
        color: var(--bg);
        padding: 10px 14px;
        border-radius: 6px;
        z-index: 50;
        font-weight: 700;
      }
      .skip:focus {
        top: 8px;
      }
      button,
      .btn {
        font: inherit;
        color: inherit;
        min-height: 44px;
        min-width: 44px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 16px;
        text-decoration: none;
        border: 1px solid var(--control);
        background: transparent;
        color: var(--text);
        font-weight: 600;
      }
      .btn:hover {
        background: var(--raised);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
        font-weight: 700;
      }
      .btn-primary:hover {
        background: #e0c8a8;
      }
      .btn[aria-pressed="true"] {
        background: var(--raised);
        border-color: var(--accent);
        color: var(--accent);
      }
      /* 머리띠 */
      .bar {
        height: 56px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .logo {
        margin: 0;
        line-height: 0;
      }
      .logo img {
        height: 30px;
        width: auto;
        display: block;
      }
      .bar .btn {
        padding: 0 12px;
        font-size: 14px;
      }
      /* 첫 화면 */
      .hero {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 56px);
        height: calc(100svh - 56px);
        min-height: 560px;
        padding: 0 16px 16px;
      }
      .hero-text {
        padding-top: 4px;
      }
      .sub {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--muted);
        font-weight: 600;
      }
      .philo {
        margin: 6px 0 4px;
        font-size: 22px;
        line-height: 1.35;
        font-weight: 750;
        letter-spacing: -0.01em;
      }
      .philo .star {
        color: var(--accent);
      }
      .teamline {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .stage {
        position: relative;
        flex: 1;
        min-height: 300px;
        margin: 8px -16px 8px;
        overflow: hidden;
        touch-action: pan-y;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        /* 바닥 가장자리가 페이지 바탕(#191919)으로 사라지게 */
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
      }
      @media (min-width: 960px) {
        .stage canvas {
          -webkit-mask-image: radial-gradient(ellipse 50% 58% at 50% 52%, #000 70%, transparent 100%);
          mask-image: radial-gradient(ellipse 50% 58% at 50% 52%, #000 70%, transparent 100%);
        }
      }
      .stage.is-3d {
        cursor: grab;
      }
      .stage.is-3d.dragging {
        cursor: grabbing;
      }
      .pins,
      .tiles {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .pins li {
        position: absolute;
        left: 0;
        top: 0;
      }
      .pin {
        position: absolute;
        transform: translate(-50%, -100%);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: transparent;
        border: 0;
        padding: 0 0 2px;
        border-radius: 12px;
      }
      .pin:hover .pin-name {
        border-color: var(--accent);
      }
      .pin:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0;
        background: #d4b8951a;
      }
      .pin-name {
        display: inline-block;
        font-size: 13px;
        line-height: 1;
        font-weight: 650;
        padding: 5px 8px;
        border-radius: 999px;
        background: #191919e6;
        border: 1px solid var(--line);
        color: var(--text);
        white-space: nowrap;
      }
      .pin-name.owner {
        color: var(--accent);
        border-color: var(--accent);
      }
      .stage-status {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 6px;
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        pointer-events: none;
      }
      .view3d {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 4px;
        background: #191919e6;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .view3d .btn {
        padding: 0 12px;
        font-size: 14px;
        border-color: transparent;
      }
      .view3d .btn[aria-pressed="true"] {
        border-color: var(--accent);
      }
      .view3d[hidden],
      .tiles[hidden],
      .pins[hidden] {
        display: none;
      }
      /* WebGL이 없을 때: 같은 12명을 그림 없이 */
      .tiles {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        align-content: center;
        gap: 10px 4px;
        padding: 8px 12px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 1px solid transparent;
        padding: 8px 2px;
        width: 100%;
      }
      .tile:hover {
        border-color: var(--line);
      }
      .face {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--skin);
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 2px #00000022;
      }
      .face::before {
        content: "";
        position: absolute;
        left: -4px;
        right: -4px;
        top: -18px;
        height: 30px;
        border-radius: 50%;
        background: var(--hair);
      }
      .face::after {
        content: "";
        position: absolute;
        left: 13px;
        top: 24px;
        width: 4px;
        height: 6px;
        border-radius: 3px;
        background: #241b19;
        box-shadow: 16px 0 0 #241b19;
      }
      .tile.owner .face {
        box-shadow: 0 0 0 2px var(--accent);
      }
      .tile .pin-name {
        font-size: 13px;
      }
      .hero-actions {
        display: grid;
        gap: 8px;
      }
      .hero-actions .btn-primary {
        min-height: 50px;
        font-size: 16px;
      }
      .hero-actions .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .hero-actions .row:has(#open3d[hidden]) {
        grid-template-columns: 1fr;
      }
      #list:focus {
        outline: none;
      }
      /* 아래 칸들 */
      section.block {
        padding: 40px 16px 8px;
        max-width: 760px;
        margin: 0 auto;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      h2 .star {
        color: var(--accent);
        font-size: 0.8em;
        margin-right: 6px;
      }
      .how p {
        margin: 0 0 10px;
      }
      .approvals {
        list-style: none;
        padding: 0;
        margin: 4px 0 14px;
        display: grid;
        gap: 8px;
      }
      .approvals li {
        display: grid;
        grid-template-columns: 32px 1fr;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
      }
      .approvals .n {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--raised);
        color: var(--accent);
        font-weight: 750;
      }
      .approvals b {
        display: block;
      }
      .approvals span {
        color: var(--muted);
        font-size: 14px;
      }
      .people {
        list-style: none;
        padding: 0;
        margin: 0;
        border-top: 1px solid var(--line);
      }
      .people button {
        width: 100%;
        text-align: left;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        align-items: center;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 12px 4px;
      }
      .people button:hover {
        background: var(--surface);
      }
      .people .nm {
        font-weight: 700;
      }
      .people .rl {
        color: var(--muted);
        font-weight: 500;
        margin-left: 6px;
        font-size: 14px;
      }
      .people .ds {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 14px;
      }
      .kind {
        font-size: 12px;
        font-weight: 650;
        border-radius: 999px;
        padding: 2px 9px;
        border: 1px solid var(--control);
        color: var(--text);
        white-space: nowrap;
      }
      .kind.human {
        border-color: var(--accent);
        color: var(--accent);
      }
      .empty {
        background: var(--surface);
        border: 1px dashed var(--control);
        border-radius: var(--radius);
        padding: 18px 16px;
      }
      .empty b {
        font-size: 18px;
      }
      .empty p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      footer {
        max-width: 760px;
        margin: 32px auto 0;
        padding: 16px 16px 96px;
        color: var(--muted);
        font-size: 13px;
        border-top: 1px solid var(--line);
      }
      /* 카드 대화상자 */
      dialog {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 0;
        width: min(420px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
      }
      dialog::backdrop {
        background: #000000b3;
      }
      .card-body {
        padding: 20px 20px 16px;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .card-body h2 {
        margin: 10px 0 2px;
        font-size: 26px;
      }
      .card-role {
        margin: 0 0 12px;
        color: var(--accent);
        font-weight: 650;
      }
      .card-does {
        margin: 0 0 16px;
      }
      .dlg-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px 20px;
      }
      /* PC */
      @media (min-width: 960px) {
        .bar {
          height: 64px;
          padding: 0 32px;
        }
        .logo img {
          height: 34px;
        }
        .hero {
          display: grid;
          grid-template-columns: minmax(340px, 400px) 1fr;
          grid-template-rows: 1fr auto;
          grid-template-areas: "text stage" "actions stage";
          column-gap: 24px;
          height: calc(100vh - 64px);
          min-height: 600px;
          padding: 0 32px 24px;
        }
        .hero-text {
          grid-area: text;
          align-self: center;
        }
        .philo {
          font-size: 34px;
          margin: 10px 0 10px;
        }
        .teamline {
          font-size: 16px;
        }
        .stage {
          grid-area: stage;
          margin: 0;
          border-radius: 16px;
        }
        .hero-actions {
          grid-area: actions;
          padding-bottom: 8px;
        }
        .tiles {
          grid-template-columns: repeat(6, 1fr);
        }
        section.block {
          padding-top: 56px;
        }
      }

      /* ---------- 확정 판 2: 여백과 글자 위계로 정리 (꽉 찬 버튼·알약 배지·상자 테두리 걷어냄) ---------- */
      .link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 4px;
        background: none;
        border: 0;
        border-radius: 4px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: #ffffff38;
        text-underline-offset: 6px;
      }
      .link:hover {
        color: var(--text);
        text-decoration-color: currentColor;
      }
      .link[aria-pressed="true"] {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }
      .bar {
        height: 64px;
        padding: 0 24px;
      }
      .logo img {
        height: 28px;
      }
      .bar .link {
        font-size: 13px;
      }
      .hero {
        height: calc(100vh - 64px);
        height: calc(100svh - 64px);
        padding: 0 24px 20px;
      }
      .hero-text {
        padding-top: 18px;
      }
      .sub {
        font-size: 11px;
        letter-spacing: 0.3em;
        font-weight: 500;
      }
      .philo {
        margin: 14px 0 10px;
        font-size: 24px;
        line-height: 1.45;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .stage {
        margin: 12px -24px 4px;
      }
      .hero-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 0 2px;
        color: var(--text);
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        border-bottom: 1px solid var(--accent);
      }
      .cta .arrow {
        color: var(--accent);
        transition: transform 0.2s;
      }
      .cta:hover .arrow {
        transform: translateX(4px);
      }
      @media (prefers-reduced-motion: reduce) {
        .cta .arrow {
          transition: none;
        }
      }
      .quiet {
        display: flex;
        gap: 18px;
        margin-left: -4px;
      }
      .pin-name {
        background: none;
        border: 0;
        padding: 4px 2px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        text-shadow: 0 1px 4px #000, 0 0 2px #000;
      }
      .pin-name.owner {
        color: var(--accent);
      }
      .pin:hover .pin-name {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .tile,
      .tile:hover {
        border-color: transparent;
      }
      .view3d {
        gap: 14px;
        padding: 0 8px;
        background: none;
        border: 0;
      }
      .view3d .link {
        font-size: 14px;
        text-shadow: 0 1px 4px #000;
      }
      section.block {
        padding: 96px 24px 8px;
      }
      h2 {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        margin: 0 0 20px;
      }
      h2 .star {
        font-size: 0.85em;
        margin-right: 8px;
      }
      .how p {
        font-size: 17px;
        line-height: 1.75;
        margin: 0 0 14px;
      }
      .approvals {
        margin: 6px 0 22px;
        gap: 4px;
      }
      .approvals li {
        grid-template-columns: 28px 1fr;
        background: none;
        border: 0;
        border-radius: 0;
        padding: 8px 0;
        align-items: baseline;
      }
      .approvals .n {
        width: auto;
        height: auto;
        display: inline;
        background: none;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .approvals b {
        font-weight: 600;
        display: inline;
        margin-right: 8px;
      }
      .people {
        border-top: 1px solid #2c2c2c;
      }
      .people button {
        border-bottom: 1px solid #2c2c2c;
        padding: 16px 0;
      }
      .people .nm {
        font-weight: 600;
      }
      .kind {
        border: 0;
        padding: 0;
        border-radius: 0;
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .kind.human {
        color: var(--accent);
      }
      .empty {
        background: none;
        border: 0;
        padding: 0;
      }
      .empty b {
        font-size: 17px;
        font-weight: 600;
      }
      footer {
        border-top: 0;
        margin-top: 72px;
      }
      dialog {
        border: 0;
        border-radius: 14px;
      }
      .card-body {
        padding: 28px 28px 8px;
      }
      .card-body h2 {
        font-size: 28px;
        font-weight: 600;
        color: var(--text);
        margin: 16px 0 4px;
      }
      .card-role {
        font-weight: 500;
        margin-bottom: 16px;
      }
      .dlg-foot {
        padding: 8px 24px 20px;
        align-items: center;
      }
      @media (min-width: 960px) {
        .bar {
          padding: 0 48px;
        }
        .hero {
          padding: 0 48px 32px;
          grid-template-columns: minmax(360px, 420px) 1fr;
          column-gap: 40px;
        }
        .philo {
          font-size: 38px;
          line-height: 1.35;
          margin: 18px 0 16px;
        }
        .hero-actions {
          padding-bottom: 12px;
        }
        .cta {
          font-size: 18px;
        }
        section.block {
          padding-top: 128px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#list">팀 목록으로 건너뛰기</a>
    <header class="bar">
      <h1 class="logo"><img src="%%LOGO_DATA_URI%%" alt="영재단" width="88" height="32" /></h1>
    </header>
    <main>
      <section class="hero" aria-labelledby="philo">
        <div class="hero-text">
          <p class="sub" id="sub" lang="en"></p>
          <p class="philo" id="philo"></p>
          <p class="teamline" id="teamline"></p>
        </div>
        <div class="stage" id="stage">
          <canvas id="scene" aria-hidden="true"></canvas>
          <p class="stage-status" id="stage-status" aria-live="polite"></p>
          <ul class="pins" id="pins" aria-label="팀 12명, 누르면 카드가 열립니다"></ul>
          <ul class="tiles" id="tiles" aria-label="팀 12명, 누르면 카드가 열립니다" hidden></ul>
          <div class="view3d" id="view3d" role="group" aria-label="3D 보기 방향" hidden>
            <button type="button" class="link" data-az="0" aria-pressed="true">정면</button>
            <button type="button" class="link" data-az="0.61" aria-pressed="false">3/4</button>
            <button type="button" class="link" data-az="3.14159" aria-pressed="false">뒤</button>
            <button type="button" class="link" id="close3d">정지 그림</button>
          </div>
        </div>
        <div class="hero-actions">
          <a class="cta" id="gh" href="https://github.com/YOUNGJAEDAN" rel="noopener"
            ><span id="gh-text"></span><span class="arrow" aria-hidden="true">→</span></a
          >
          <div class="quiet">
            <button type="button" class="link" id="open3d">3D로 보기</button>
            <a class="link" href="#list" id="open-list">목록으로 보기</a>
          </div>
        </div>
      </section>

      <section class="block how" id="how" aria-labelledby="how-h">
        <h2 id="how-h"><span class="star" aria-hidden="true">✦</span><span id="how-title"></span></h2>
        <p id="how-1"></p>
        <p id="how-2"></p>
        <ol class="approvals" id="approvals"></ol>
        <p id="how-3"></p>
      </section>

      <section class="block" id="list" aria-labelledby="list-h" tabindex="-1">
        <h2 id="list-h"><span class="star" aria-hidden="true">✦</span>팀 목록</h2>
        <ul class="people" id="people"></ul>
      </section>

      <section class="block" id="projects" aria-labelledby="proj-h">
        <h2 id="proj-h"><span class="star" aria-hidden="true">✦</span>프로젝트</h2>
        <div id="proj-body"></div>
      </section>

      <footer id="foot"></footer>
    </main>

    <dialog id="card" aria-labelledby="card-name" aria-describedby="card-does">
      <div class="card-body">
        <div class="card-top">
          <span class="kind" id="card-kind"></span>
        </div>
        <h2 id="card-name"></h2>
        <p class="card-role" id="card-role"></p>
        <p class="card-does" id="card-does"></p>

        <button type="button" class="link" id="card-close">닫기</button>
      </div>
    </dialog>

    <!--SITE_DATA-->
    <script>
      "use strict";
      const M = JSON.parse(document.getElementById("site-data").textContent);
      const $ = (id) => document.getElementById(id);
      const PEOPLE = M.people;
      const byId = Object.fromEntries(PEOPLE.map((p) => [p.id, p]));
      const kindLabel = (p) => (p.kind === "human" ? "사람" : "AI 직원");
      const pinLabel = (p) => (p.kind === "human" ? p.name + " ✦" : p.name);
      const roleLine = (p) => (p.kind === "human" ? p.role + " · 사람" : p.role);
      const ariaFor = (p) => `${p.name}, ${roleLine(p)}${p.kind === "human" ? "" : ", AI 직원"}. 카드 열기`;

      /* ---------- 글 채우기 ---------- */
      $("sub").textContent = M.site.subtitle;

      $("philo").append(M.site.philosophy);
      $("teamline").textContent = M.site.teamLine;
      $("gh-text").textContent = M.github.label + " · " + M.github.org;
      $("how-title").textContent = M.howWeWork.title;
      $("how-1").textContent = M.howWeWork.lines[0];
      $("how-2").textContent = M.howWeWork.lines[1];
      $("how-3").textContent = M.howWeWork.lines[2];

        const li = document.createElement("li");

        b.dataset.person = p.id;
        b.innerHTML = `<span><span class="nm"></span><span class="rl"></span></span><span class="kind"></span><span class="ds"></span>`;
        b.querySelector(".nm").textContent = pinLabel(p);

        $("proj-body").querySelector("p").textContent = M.projectsEmptyNote;
      } else {
        const ul = document.createElement("ul");
        ul.className = "people";
        for (const pr of M.projects) {
          const li = document.createElement("li");
          li.textContent = pr.name;
          ul.append(li);
        }
        $("proj-body").append(ul);
      }
      $("foot").textContent = `${M.asOf} 기준 · 검색 노출 끔(noindex)`;

      /* ---------- 카드 ---------- */
      const card = $("card");
      let cardReturn = null;
      function openCard(id, from) {
        const p = byId[id];
        if (!p) return;
        $("card-kind").textContent = kindLabel(p);
        $("card-kind").className = "kind" + (p.kind === "human" ? " human" : "");
        $("card-name").textContent = pinLabel(p);
        $("card-role").textContent = roleLine(p);
        $("card-does").textContent = p.does;
        // 이미 열린 카드를 다시 열 때(해시 재적용 등)는 돌아갈 곳을 덮어쓰지 않는다.
        if (!card.open) {
          // 해시로 바로 연 경우처럼 돌아갈 곳이 없으면 그 사람의 보이는 버튼으로 돌아간다.
          const active = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
          cardReturn =
            from || active || [...document.querySelectorAll('[data-person="' + id + '"]')].find((b) => b.offsetParent) || null;
          card.showModal();
        }
        $("card-close").focus();
        state.card = id;
        writeHash();
      }
      card.addEventListener("close", () => {
        state.card = null;
        writeHash();
        if (cardReturn && document.contains(cardReturn)) cardReturn.focus({ preventScroll: true });
      });
      $("card-close").onclick = () => card.close();
      card.addEventListener("click", (e) => {
        if (e.target === card) card.close();
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-person]");
        if (!b) return;
        if (suppressClick) {
          e.preventDefault();
          return;
        }
        openCard(b.dataset.person, b);
      });

      /* ---------- 주소 해시: #card=s-design, #3d(&view=front|34|back), #list, #nogl ---------- */
      const state = { card: null, three: false, list: false };
      function parseHash() {
        const out = {};
        for (const part of location.hash.slice(1).split("&")) {
          if (!part) continue;
          const [k, v] = part.split("=");
          // 잘못된 % 인코딩(#%, #card=%E0%A4%A)은 그 항목만 무시하고 초기화를 이어 간다.
          try {
            out[decodeURIComponent(k)] = v === undefined ? true : decodeURIComponent(v);
          } catch (_) {}
        }
        return out;
      }
      const H0 = parseHash();
      const forceNoGL = !!H0.nogl;
      function writeHash() {
        const parts = [];
        if (forceNoGL) parts.push("nogl");
        if (state.three) parts.push("3d");
        if (state.card) parts.push("card=" + state.card);
        const h = parts.length ? "#" + parts.join("&") : location.pathname + location.search;
        if (("#" + location.hash.slice(1)) !== h) history.replaceState(null, "", h);
      }
      function applyHash() {
        const h = parseHash();
        if (h["3d"] && can3d) {
          enter3d(false);
          const v = { front: 0, "34": 0.61, back: PI }[h.view];
          if (v !== undefined) {
            az = azTarget = v;
            setPressed(v);
          }
        }
        else if (!h["3d"] && state.three) exit3d(false);
        if (h.list) {
          $("list").scrollIntoView({ block: "start" });
          $("list").focus({ preventScroll: true });
        }
        if (typeof h.card === "string" && byId[h.card]) openCard(h.card);
      }
      addEventListener("hashchange", applyHash);
      $("open-list").addEventListener("click", (e) => {
        e.preventDefault();
        $("list").scrollIntoView({ block: "start" });
        $("list").focus({ preventScroll: true });
      });


      /* ---------- 팀 그림: 배치 계산(그림 없이도 동작) ---------- */
      const stage = $("stage");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      let can3d = false;
      let suppressClick = false;
      const PI = Math.PI,
        TAU = PI * 2;
      const norm = (a) => {
          const l = Math.hypot(...a);
          return a.map((x) => x / l);
        },
        cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
        dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
      function matmul(a, b) {
        const o = new Float32Array(16);
        for (let c = 0; c < 4; c++)
          for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k];
        return o;
      }
      function ortho(l, r, b, t, n, f) {
        return new Float32Array([
          2 / (r - l), 0, 0, 0, 0, 2 / (t - b), 0, 0, 0, 0, -2 / (f - n), 0,
          -(r + l) / (r - l), -(t + b) / (t - b), -(f + n) / (f - n), 1,
        ]);
      }
      function lookAt(e, t) {
        const z = norm(e.map((x, i) => x - t[i])),
          x = norm(cross([0, 1, 0], z)),
          y = cross(z, x);
        return new Float32Array([
          x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1,
        ]);
      }
      const apply4 = (m, p) => {
        const q = [0, 0, 0, 0],
          a = [...p, 1];
        for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) q[r] += m[k * 4 + r] * a[k];
        return q;
      };
      // 카메라는 원본과 같은 높이·각도(정면)에 고정하고, 3D 보기에서는 캐릭터가 제자리에서 돈다.
      const camera = [0, 16, 25],
        target = [0, 1.8, 0],
        view = lookAt(camera, target);
      const L = { vp: null, offsets: [], ww: 0, hh: 0, cols: 6 };
      function layout() {
        const r = stage.getBoundingClientRect();
        L.ww = Math.max(1, r.width);
        L.hh = Math.max(1, r.height);
        const wide = L.ww / L.hh >= 1.15;
        const cols = wide ? 6 : 4,
          rows = 12 / cols,
          dz = wide ? 8.6 : 8.2;
        L.cols = cols;
        // 직원 순서는 원본 그대로: 앞 번호가 뒷줄.
        L.offsets = PEOPLE.map((_, i) => [
          ((i % cols) - (cols - 1) / 2) * 2.36,
          0,
          (Math.floor(i / cols) - (rows - 1) / 2) * dz,
        ]);
        // 화면 맞춤: 모든 캐릭터의 상자를 보기 공간으로 옮겨 테두리를 잰다(돌려도 잘리지 않게 반경 0.9).
        let x0 = 1e9,
          x1 = -1e9,
          y0 = 1e9,
          y1 = -1e9;
        for (const o of L.offsets)
          for (const dx of [-0.9, 0.9])
            for (const dy of [-0.15, 3.95])
              for (const dzz of [-0.9, 0.9]) {
                const q = apply4(view, [o[0] + dx, o[1] + dy, o[2] + dzz]);
                x0 = Math.min(x0, q[0]);
                x1 = Math.max(x1, q[0]);
                y0 = Math.min(y0, q[1]);
                y1 = Math.max(y1, q[1]);
              }
        const topPad = 34, // 위쪽 상태 글줄
          botPad = state.three ? 100 : 30, // 이름표, 3D 버튼
          sidePad = 8;
        const s = Math.min((L.ww - sidePad * 2) / (x1 - x0), (L.hh - topPad - botPad) / (y1 - y0));
        const cx = (x0 + x1) / 2,
          cy = (y0 + y1) / 2 - (botPad - topPad) / 2 / s;
        const hw = L.ww / s / 2,
          hh = L.hh / s / 2;
        L.scale = s;
        L.vp = matmul(ortho(cx - hw, cx + hw, cy - hh, cy + hh, 0.1, 80), view);
        placePins();
      }
      function toScreen(p) {
        const q = apply4(L.vp, p);
        return [((q[0] / q[3]) * 0.5 + 0.5) * L.ww, (1 - ((q[1] / q[3]) * 0.5 + 0.5)) * L.hh];
      }
      const pinEls = [];
      for (const p of PEOPLE) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin";
        b.dataset.person = p.id;
        b.setAttribute("aria-label", ariaFor(p));
        const nm = document.createElement("span");
        nm.className = "pin-name" + (p.kind === "human" ? " owner" : "");
        nm.textContent = pinLabel(p);
        nm.setAttribute("aria-hidden", "true");
        b.append(nm);
        li.append(b);
        $("pins").append(li);
        pinEls.push(b);
      }
      function placePins() {
        const colPx = 2.36 * L.scale;
        PEOPLE.forEach((p, i) => {
          const o = L.offsets[i];
          const feet = toScreen([o[0], 0, o[2] + 0.35]);
          const head = toScreen([o[0], 3.9, o[2]]);
          const b = pinEls[i];
          const w = Math.max(48, Math.min(colPx * 0.9, 110));
          const h = Math.max(48, feet[1] - head[1] + 26);
          b.style.left = feet[0] + "px";
          b.style.top = feet[1] + 22 + "px";
          b.style.width = w + "px";
          b.style.height = h + "px";
        });
      }
      for (const p of PEOPLE) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tile" + (p.kind === "human" ? " owner" : "");
        b.dataset.person = p.id;
        b.setAttribute("aria-label", ariaFor(p));
        b.innerHTML = `<span class="face" aria-hidden="true"></span><span class="pin-name" aria-hidden="true"></span>`;
        b.querySelector(".face").style.setProperty("--skin", p.look.skin);
        b.querySelector(".face").style.setProperty("--hair", p.look.hair);
        const nm = b.querySelector(".pin-name");
        nm.textContent = pinLabel(p);
        if (p.kind === "human") nm.classList.add("owner");
        li.append(b);
        $("tiles").append(li);
      }
      function useFallback(reason) {
        $("pins").hidden = true;
        $("tiles").hidden = false;
        $("scene").style.display = "none";
        $("view3d").hidden = true;
        $("open3d").hidden = true;
        $("stage-status").textContent = reason;
        can3d = false;
        state.three = false;
        stage.classList.remove("is-3d");
      }

      /* ---------- 3D 보기 상태 ---------- */
      let R3 = null; // 렌더러(그림이 준비되면)
      let az = 0,
        azTarget = 0,
        running = false,
        visible = true,
        raf = 0;
      function setPressed(a) {
        for (const b of $("view3d").querySelectorAll("[data-az]"))
          b.setAttribute("aria-pressed", Math.abs(+b.dataset.az - a) < 0.01 ? "true" : "false");
      }
      function enter3d(scroll = true) {
        if (!can3d || state.three) return;
        state.three = true;
        stage.classList.add("is-3d");
        stage.style.touchAction = "pan-y";
        $("view3d").hidden = false;
        $("open3d").setAttribute("aria-pressed", "true");
        $("open3d").textContent = "3D 보는 중";
        $("stage-status").textContent = "옆으로 끌어서 돌려 보세요";
        writeHash();
        layout();
        if (scroll) stage.scrollIntoView({ block: "nearest" });
        updateLoop();
      }
      function exit3d(focusBack = true) {
        if (!state.three) return;
        state.three = false;
        stage.classList.remove("is-3d");
        $("view3d").hidden = true;
        $("open3d").setAttribute("aria-pressed", "false");
        $("open3d").textContent = "3D로 보기";
        $("stage-status").textContent = "";
        az = azTarget = 0;
        setPressed(0);
        writeHash();
        layout();
        updateLoop();
        drawStill();
        if (focusBack) $("open3d").focus();
      }
      $("open3d").onclick = () => (state.three ? exit3d() : enter3d());
      $("close3d").onclick = () => exit3d();
      for (const b of $("view3d").querySelectorAll("[data-az]"))
        b.onclick = () => {
          azTarget = +b.dataset.az;
          // 가장 가까운 쪽으로 돌기
          const k = Math.round((az - azTarget) / TAU);
          azTarget += k * TAU;
          setPressed(+b.dataset.az);
        };
      function updateLoop() {
        const want = state.three && visible && !document.hidden && !!R3;
        if (want && !running) {
          running = true;
          raf = requestAnimationFrame(loop);
        } else if (!want && running) {
          running = false;
          cancelAnimationFrame(raf);
        }
      }
      function loop(ms) {
        if (!running) return;
        if (!dragging) az += (azTarget - az) * 0.12;
        R3.draw(ms * 0.001, az, true);
        raf = requestAnimationFrame(loop);
      }
      document.addEventListener("visibilitychange", updateLoop);
      new IntersectionObserver((es) => {
        visible = es[0].isIntersecting;
        updateLoop();
      }).observe(stage);
      // 끌어서 돌리기
      let dragging = false,
        dragX = 0,
        dragMoved = 0,
        dragPid = null;
      stage.addEventListener("pointerdown", (e) => {
        if (!state.three || e.target.closest(".view3d")) return;
        dragging = true;
        dragX = e.clientX;
        dragMoved = 0;
        dragPid = e.pointerId;
      });
      stage.addEventListener("pointermove", (e) => {
        if (!dragging || e.pointerId !== dragPid) return;
        const dx = e.clientX - dragX;
        dragX = e.clientX;
        dragMoved += Math.abs(dx);
        if (dragMoved > 6) {
          stage.classList.add("dragging");
          if (!stage.hasPointerCapture(e.pointerId)) stage.setPointerCapture(e.pointerId);
        }
        az += dx * 0.012;
        azTarget = az;
        setPressed(NaN);
      });
      function endDrag(e) {
        if (!dragging || e.pointerId !== dragPid) return;
        dragging = false;
        stage.classList.remove("dragging");
        if (dragMoved > 6) {
          suppressClick = true;
          setTimeout(() => (suppressClick = false), 0);
        }
      }
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);
      stage.addEventListener("keydown", (e) => {
        if (!state.three) return;
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          azTarget += e.key === "ArrowLeft" ? -0.4 : 0.4;
          setPressed(NaN);
          e.preventDefault();
        } else if (e.key === "Escape" && !card.open) exit3d();
      });

      let stillQueued = false;
      function drawStill() {
        if (!R3 || state.three || stillQueued) return;
        stillQueued = true;
        requestAnimationFrame(() => {
          stillQueued = false;
          if (R3 && !state.three) R3.draw(0, 0, false);
        });
      }
      let resizeQ = false;
      addEventListener("resize", () => {
        if (resizeQ) return;
        resizeQ = true;
        requestAnimationFrame(() => {
          resizeQ = false;
          layout();
          if (R3) R3.resize();
          drawStill();
        });
      });

      /* ---------- 캐릭터 렌더러 (Codex 원본 codex-characters.html에서 가져옴) ----------
         바뀐 것: 배경·바닥·조명을 다크로, 테두리 빛을 포인트색으로. 형상·외형·순서는 원본 그대로.
         정지 그림은 한 프레임만 그리고 루프를 돌리지 않는다. */
      function createRenderer(canvas) {
        const gl = canvas.getContext("webgl2", { antialias: true, alpha: false, powerPreference: "low-power" });
        if (!gl) return null;
        const DATA = PEOPLE;
        const rgb = (hex) => hex.match(/[a-f\d]{2}/gi).map((v) => Math.pow(parseInt(v, 16) / 255, 2.2));
        const mix = (a, b, t) => a.map((v, i) => v * (1 - t) + b[i] * t);
        const C = {
          top: rgb("#36322f"),
          pants: rgb("#2f3442"),
          white: rgb("#fffdf7"),
          sole: rgb("#e3dfd6"),
          eye: rgb("#241b19"),
          mouth: rgb("#774636"),
          blush: rgb("#edac9b"),
          frame: rgb("#51483e"),
        };
        function program(v, f) {
          const p = gl.createProgram();
          for (const [s, src] of [
            [gl.VERTEX_SHADER, v],
            [gl.FRAGMENT_SHADER, f],
          ]) {
            const sh = gl.createShader(s);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(sh));
            gl.attachShader(p, sh);
          }
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(p));
          return p;
        }
        const vs = `#version 300 es
precision highp float;
layout(location=0) in vec3 position;layout(location=1) in vec3 normal;layout(location=2) in vec3 color;
uniform mat4 vp;uniform mat4 lightVP;uniform vec3 offset;uniform float turn;uniform float breath;uniform float blink;uniform float eyePart;
out vec3 N;out vec3 P;out vec3 col;out vec4 shadow;
void main(){vec3 q=position;vec3 nn=normal;if(eyePart>0.5){q.y=2.885+(q.y-2.885)*blink;nn=normalize(nn/vec3(1.,max(blink,.04),1.));}q.y+=(q.y>1.25?breath*smoothstep(1.25,2.6,q.y):0.);float c=cos(turn),s=sin(turn);mat3 rot=mat3(c,0.,-s,0.,1.,0.,s,0.,c);P=rot*q+offset;N=rot*nn;col=color;shadow=lightVP*vec4(P,1.);gl_Position=vp*vec4(P,1.);}`;
        // 다크 판: 바닥은 #191919 쪽으로 사라지고, 반구광을 낮추고, 포인트색 테두리 빛으로 실루엣을 살린다.
        const fs = `#version 300 es
precision highp float;
in vec3 N;in vec3 P;in vec3 col;in vec4 shadow;out vec4 frag;
uniform sampler2D shadowMap;uniform vec3 camera;uniform vec3 centers[12];uniform float floorPart;uniform float fadeR;
float shade(){vec3 p=shadow.xyz/shadow.w*.5+.5;float occ=0.;float bias=max(.00035*(1.-dot(normalize(N),normalize(vec3(-.5,1.,.7)))),.00013);for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++){float z=texture(shadowMap,p.xy+vec2(float(x),float(y))*.0008).r;occ+=p.z-bias>z?1.:0.;}return 1.-occ/9.*.45;}

              gl.uniform1f(u.breath, animate ? Math.sin(t * 1.85 + c.phase) * 0.012 : 0);
              gl.uniform1f(u.eyePart, 0);
              gl.uniform1f(u.blink, 1);
              draw(c.body);
              const cycle = (t + c.phase) % 5.7,
                blink = animate ? 1 - 0.94 * Math.exp(-Math.pow((cycle - 4.95) / 0.075, 2)) : 1;
              gl.uniform1f(u.eyePart, 1);
              gl.uniform1f(u.blink, blink);
              draw(c.eyes);
            });
          }
        }
        return {
          gl,
          draw: frame,
          resize: () => {
            resize();
            lastTurn = NaN;
          },
          stats: () => ({ characters: chars.length, vertices: chars.reduce((n, c) => n + c.body.count + c.eyes.count, 0), error: gl.getError() }),
        };
      }

      /* ---------- 시작 ---------- */
      layout();
      const hasGL2 = (() => {
        if (forceNoGL) return false;
        try {
          return !!document.createElement("canvas").getContext("webgl2");
        } catch (_) {
          return false;
        }
      })();
      if (!hasGL2) {
        useFallback(forceNoGL ? "그림 없이 보기(#nogl)" : "이 브라우저는 3D 그림을 지원하지 않아 이름으로 보여 드려요");
        applyHash();
      } else {
        $("stage-status").textContent = "그림을 그리는 중…";
        if (reduced.matches) $("open3d").hidden = true;
        can3d = !reduced.matches;
        // 글이 먼저 보이도록 그림은 첫 화면이 그려진 다음에 만든다.
        requestAnimationFrame(() =>
          setTimeout(() => {
            try {
              R3 = createRenderer($("scene"));
              if (!R3) throw Error("no webgl2");
              $("scene").addEventListener("webglcontextlost", (e) => {
                e.preventDefault();
                R3 = null;
                updateLoop();
                useFallback("그림을 그릴 수 없어 이름으로 보여 드려요");
              });
              $("stage-status").textContent = reduced.matches ? "동작 줄이기 설정이라 정지 그림만 보여 드려요" : "";
              if (state.three) {
                $("stage-status").textContent = "옆으로 끌어서 돌려 보세요";
                updateLoop();
              } else R3.draw(0, 0, false);
              window.__site = { stats: () => R3 && R3.stats(), state };
            } catch (err) {
              R3 = null;
              useFallback("그림을 그릴 수 없어 이름으로 보여 드려요");
            }
            applyHash();
          }, 0),
        );
        // 해시로 바로 여는 카드·목록은 그림을 기다리지 않는다.
        const h = parseHash();
        if (h.card || h.list) applyHash();
        // 보는 중에 동작 줄이기 설정이 바뀌면 3D를 끄거나 다시 켤 수 있게 한다(이름 목록으로 바뀐 뒤에는 그대로 둔다).
        reduced.addEventListener("change", () => {
          if (!$("tiles").hidden) return;
          if (reduced.matches) {
            exit3d(false);
            can3d = false;
            $("open3d").hidden = true;
            if (R3) $("stage-status").textContent = "동작 줄이기 설정이라 정지 그림만 보여 드려요";
          } else {
            can3d = true;
            $("open3d").hidden = false;
            if (R3) $("stage-status").textContent = "";
          }
          updateLoop();
        });
      }
    </script>
  </body>
</html>
