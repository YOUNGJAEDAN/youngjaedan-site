# PR과 모든 브랜치 push에서 빌드 검사를 돌리고, 커밋된 site/index.html이 원본에서 만든 결과와 같은지 확인한다.
# Action은 커밋 SHA로 고정한다(주석은 그 SHA의 태그).
name: Check

on:
  pull_request:
  push:

permissions: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build check
        run: node site/src/build.mjs && git diff --exit-code site/index.html
