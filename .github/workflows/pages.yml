# main에 push되거나 main에서 수동 실행하면 site/index.html을 GitHub Pages로 배포한다.
# Action은 커밋 SHA로 고정한다(주석은 그 SHA의 태그).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 다른 브랜치에서 수동 실행해도 공개 페이지를 덮지 않게 main에서만 배포한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # 빌드 검사를 다시 돌리고, 커밋된 index.html이 원본에서 만든 결과와 같은지 확인한다.
      - name: Build check
        run: node site/src/build.mjs && git diff --exit-code site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # 생성 결과인 index.html만 올린다(site/src/ 원본은 배포하지 않음).
      - name: Stage site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
